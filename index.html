en;margin-top:14px}.fill{height:100%;border-radius:10px}.subline{display:flex;justify-content:space-between;margin-top:11px;color:var(--muted);font-size:11px;gap:10px}.todayitem{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;margin:8px 0}.tick{width:23px;height:23px;border:1px solid #718398;background:transparent;border-radius:8px;flex:none;color:var(--mint)}.tick.done{background:#214539;border-color:#37745d}.tasktitle{font-size:13px;font-weight:600;line-height:1.5}.completed{text-decoration:line-through;color:var(--muted)}.meta{color:var(--muted);font-size:11px;margin-top:5px}.empty{padding:35px 12px;color:var(--muted);text-align:center}.hint{padding:14px;border-radius:12px;background:#1c2a3b;color:#bad3ec;font-size:12px;line-height:1.7}.back{background:transparent;border:0;color:var(--accent);padding:0;font-size:13px}.hero{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:17px;margin:14px 0}.hero h2{margin:4px 0 10px}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:11px}.controls button{background:#243348;color:#eaf2fc;border:1px solid #40526c;border-radius:11px;padding:9px 13px;font-size:12px}.controls button.primary{background:#315a7d;border-color:#5582a4}.controls .speed{color:var(--muted);font-size:11px;margin-left:auto}.timeline{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#121a26}.timelinewrap{display:flex}.phasecol{width:100px;flex:none;z-index:3;box-shadow:5px 0 12px #0c121cb0;background:#202b3b}.corner,.dates{height:42px;border-bottom:1px solid var(--line);display:flex;align-items:center}.corner{padding:0 12px;color:var(--muted);font-size:11px}.phase{height:64px;padding:10px 9px;border-bottom:1px solid var(--line);display:flex;align-items:center;font-size:12px;font-weight:600}.timeviewport{overflow-x:auto;flex:1;scrollbar-width:thin;scrollbar-color:#44566d transparent;overscroll-behavior-x:contain}.timeinner{width:2352px}.dates{position:sticky;top:0;background:#243246;z-index:2}.week{width:56px;flex:none;text-align:center;color:#bdd0e6;font-size:11px;border-right:1px solid #3a4860}.week.isToday{background:#385873;color:white;font-weight:700}.week span{font-size:10px;color:#8fa5bd}.week.isToday span{color:white}.lane{height:64px;position:relative;border-bottom:1px solid var(--line);background-image:linear-gradient(to right,#253247 1px,transparent 1px);background-size:56px 100%}.bar{position:absolute;top:15px;height:33px;border:0;border-radius:8px;color:#101b29;font-weight:700;padding:0 10px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;text-align:left;font-size:11px}.bar.done{opacity:.5}.timeline-foot{font-size:11px;color:var(--muted);margin-top:9px}.drawerShade{position:fixed;inset:0;background:#030711b9;z-index:20;display:none}.drawerShade.show{display:block}.drawer{position:fixed;bottom:0;left:0;right:0;max-width:820px;margin:auto;z-index:21;background:#202a3a;border:1px solid #455670;border-radius:23px 23px 0 0;transform:translateY(110%);transition:transform .26s ease;padding:21px 20px max(26px,env(safe-area-inset-bottom));max-height:82vh;overflow:auto}.drawer.show{transform:translateY(0)}.drawerhandle{height:4px;width:42px;background:#8192a7;border-radius:8px;margin:-8px auto 20px}.drawerclose{float:right;background:transparent;color:white;border:0;font-size:22px}.drow{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:16px 0}.status{font-size:11px;color:var(--mint)}.action{background:#9dd7ff;color:#102335;border:0;padding:13px 16px;border-radius:12px;font-weight:750}.action.secondary{background:#34445b;color:#e7eff8}.formline{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}textarea{width:100%;min-height:75px;background:#111c29;color:white;border:1px solid #46566d;border-radius:10px;padding:11px;resize:vertical}.smallnote{font-size:11px;color:var(--muted);line-height:1.6}.routine{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:9px 0}.freq{font-size:11px;color:var(--mint)}.footer{color:#64748b;text-align:center;font-size:10px;padding:15px}.counter{font-size:12px;color:var(--mint);font-weight:700}@media(prefers-reduced-motion:reduce){.drawer{transition:none}}@media(max-width:390px){.phasecol{width:87px}.week{width:152px}h1{font-size:24px}}

<div class="app"><header><div><div class="eyebrow">FLOW · PERSONAL PROJECT CALENDAR</div><h1>動くカレンダー</h1><div id="date" class="date"></div></div><span class="pill">PROTOTYPE 0.3</span></header>

<main id="main"></main><div class="footer">FLOW v0.3 · 仮の案件データです · 記録はこの端末のブラウザ内に保存</div></div>
<div class="drawerShade" id="shade" onclick="closeDrawer()"></div><div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="日付・作業の詳細"><div class="drawerhandle"></div><button class="drawerclose" onclick="closeDrawer()" aria-label="閉じる">×</button><div id="drawerContent"></div></div><script>
'use strict';
// 試作段階の案件・工程サンプル。日付別タスクは本日の相対日付で作成する。
const projects=[
 {id:'catalog',title:'製品カタログ制作',color:'#83c6ff',progress:75,next:'企画内容と構成案の確認',state:'進行中',phases:['企画','制作','校正','納品'],bars:[
  {row:0,start:0,length:2,title:'企画・構成',detail:'ターゲットと商品構成の確認'},
  {row:1,start:2,length:2,title:'デザイン・画像',detail:'素材の手配と紙面制作'},
  {row:2,start:4,length:1,title:'最終校正',detail:'最終版と修正指示の確認'},
  {row:3,start:5,length:1,title:'入稿・印刷',detail:'印刷仕様・納品場所の確認'}]},
 {id:'event',title:'ライダー向けイベント企画',color:'#ffcf87',progress:48,next:'運営・告知の確認',state:'確認待ち',phases:['企画','会場・協力','集客','本番'],bars:[
  {row:0,start:0,length:2,title:'企画構成',detail:'コンセプトと内容の決定'},
  {row:1,start:2,length:2,title:'運営調整',detail:'会場、スタッフなどの役割を確認'},
  {row:2,start:3,length:2,title:'SNS・告知',detail:'告知素材、申込み状況の確認'},
  {row:3,start:5,length:1,title:'実施・記録',detail:'当日の進行、写真・動画記録'}]},
 {id:'ec',title:'ECサイト販促改善',color:'#95e5c8',progress:86,next:'広告と商品情報の確認',state:'進行中',phases:['調査','商品情報','集客施策','効果検証'],bars:[
  {row:0,start:0,length:2,title:'課題整理',detail:'サイト流入と商品導線の分析'},
  {row:1,start:2,length:2,title:'商品説明・SEO',detail:'商品ページと検索表示の改善'},
  {row:2,start:3,length:2,title:'広告・連携',detail:'媒体設定・商品連携を確認'},
  {row:3,start:5,length:1,title:'結果確認',detail:'クリック・注文状況を確認'}]}
];
const routines=[
 {id:'morning',name:'今日の優先順位と予定を確認',freq:'毎日',when:'daily'},
 {id:'reply',name:'連絡待ち・確認待ちを見直す',freq:'月・水・金',when:'mwf'},
 {id:'weekly',name:'進行中の案件を棚卸し',freq:'毎週月曜日',when:'monday'},
 {id:'evening',name:'未完了項目を振り返る',freq:'毎日',when:'daily'}
];
const today=new Date();today.setHours(12,0,0,0);
const dayMs=86400000;
const toKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const dateOffset=(delta)=>{const d=parseKey(stored.demoAnchor||todayKey);d.setDate(d.getDate()+delta);return toKey(d)};
const todayKey=toKey(today);
const formatDate=k=>new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'long'}).format(parseKey(k));
const monday=new Date(today);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
const days=Array.from({length:42},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return toKey(d)});
let stored={};try{stored=JSON.parse(localStorage.getItem('flow-demo-v03')||'{}')}catch(e){}
if(!Array.isArray(stored.customTasks))stored.customTasks=[];
// サンプル予定は初回起動日を基準に固定し、翌日以降にずれないようにする。
if(!stored.demoAnchor){stored.demoAnchor=todayKey;try{localStorage.setItem('flow-demo-v03',JSON.stringify(stored))}catch(e){}}
const dailyTemplates=[
 {project:'catalog',row:0,offset:0,title:'掲載する商品の候補を整理',detail:'掲載商品の候補を一覧にして、優先順位を付ける'},
 {project:'catalog',row:0,offset:1,title:'カタログ全体の構成案を作成',detail:'見開き構成、掲載順、主な訴求点を検討する'},
 {project:'catalog',row:0,offset:2,title:'競合カタログの表現を確認',detail:'参考となるデザインや訴求方法を比較する'},
 {project:'catalog',row:0,offset:3,title:'掲載写真と仕様情報を確認',detail:'不足する画像、商品スペックを洗い出す'},
 {project:'catalog',row:0,offset:4,title:'企画案を関係者へ共有',detail:'構成案を送り、意見を依頼する'},
 {project:'catalog',row:0,offset:5,title:'企画案への返答を確認',detail:'コメントと修正希望を整理する'},
 {project:'catalog',row:0,offset:7,title:'企画の方向性を確定',detail:'決定事項を制作工程へ引き継ぐ'},
 {project:'catalog',row:1,offset:16,title:'デザイン初稿の制作状況を確認',detail:'写真・文章の不足をチェックする'},
 {project:'catalog',row:2,offset:30,title:'校正紙の修正箇所をまとめる',detail:'修正漏れを点検する'},
 {project:'event',row:0,offset:0,title:'イベント企画の条件を整理',detail:'参加者像と開催目的のすり合わせ'},
 {project:'event',row:0,offset:2,title:'企画概要を見直す',detail:'プログラム、参加人数、必要人員を整理'},
 {project:'event',row:1,offset:16,title:'協力先からの返答を確認',detail:'会場、スタッフ調整について連絡する'},
 {project:'event',row:2,offset:25,title:'告知原稿の確認',detail:'SNS掲載内容と公開日を確認する'},
 {project:'ec',row:0,offset:0,title:'サイトの現状を確認',detail:'流入導線と商品の表示内容を確認する'},
 {project:'ec',row:0,offset:1,title:'改善すべき商品ページを洗い出す',detail:'優先順位をつけて記録する'},
 {project:'ec',row:1,offset:16,title:'商品説明の修正状況を確認',detail:'タイトル、SEO、仕様表示を照合する'},
 {project:'ec',row:2,offset:25,title:'広告設定をチェック',detail:'掲載状況、設定項目、商品の連携を点検する'}
];
// sample task ids: stable for this prototype version of the browser; custom IDs are persisted.
const sampleTasks=dailyTemplates.map((x,i)=>({id:`sample-${i}`,project:x.project,row:x.row,date:dateOffset(x.offset),title:x.title,detail:x.detail}));
let tab='projects',active=null,selected=null,animation=null,lastTime=0,speed=85,selectedDate=todayKey;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem('flow-demo-v03',JSON.stringify(stored))}catch(e){alert('ブラウザの保存領域を利用できませんでした')}};
const isDone=id=>!!stored['d:'+id];
const allDayTasks=()=>sampleTasks.concat(stored.customTasks);
const dateTasks=(project,key)=>allDayTasks().filter(t=>t.date===key && (!project||t.project===project)).sort((a,b)=>a.row-b.row);
const byId=id=>allDayTasks().find(t=>t.id===id);
const routineVisible=(r,date=today)=>r.when==='daily'||r.when==='mwf'&&[1,3,5].includes(date.getDay())||r.when==='monday'&&date.getDay()===1;
const getProject=id=>projects.find(p=>p.id===id);
const taskKey=id=>'dt:'+id;
const goToday=()=>switchTab('today');
document.getElementById('date').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(today);
function switchTab(t){stopFlow();closeDrawer();active=null;tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.id==='tab-'+t));render()}
function render(){const root=document.getElementById('main');if(active){renderTimeline(root);return;}
 if(tab==='projects'){
 root.innerHTML=`<div class="sectionhead"><h2>プロジェクト一覧</h2><small>タップして流れを見る</small></div><div class="hint">今度は、<strong>流れる日付をタップ</strong>すると「その日のやること」が工程別に現れます。日付ごとの内容も追加できます。</div>`+
 projects.map(p=>`<button class="project" onclick="openProject('${p.id}')"><div class="projecttop"><div class="titleline"><span class="dot" style="background:${p.color}"></span><strong>${esc(p.title)}</strong></div><span class="chev">›</span></div><div class="progress"><div class="fill" style="width:${p.progress}%;background:${p.color}"></div></div><div class="subline"><span>進行 ${p.progress}% · ${p.state}</span><span>次：${esc(p.next)}</span></div></button>`).join('')+
 '<div class="sectionhead"><h2>今日の確認事項</h2><button class="back" onclick="goToday()">すべて見る →</button></div>'+getTodayList().slice(0,3).map(todayItemHTML).join('');
 }else if(tab==='today'){
 const list=getTodayList();root.innerHTML=`<div class="sectionhead"><h2>今日やること</h2><span class="counter">${list.filter(x=>isDone(x.id)).length} / ${list.length} 完了</span></div><div class="hint">各プロジェクトの「今日の作業」と、今日のルーティンをまとめて表示します。作業をタップすると詳細が開きます。</div>`+list.map(todayItemHTML).join('');
 }else{
 root.innerHTML='<div class="sectionhead"><h2>繰り返す確認</h2><small>ルールの見本</small></div><div class="hint">ルーティンは決まった曜日に表示する仕組みです。追加・編集は今後の版で対応します。</div>'+routines.map(r=>`<div class="routine"><div><strong>${esc(r.name)}</strong><div class="freq">↻ ${esc(r.freq)}</div></div><span class="pill">有効</span></div>`).join('');
 }}
function getTodayList(){
 const t=dateTasks(null,todayKey).map(x=>({id:taskKey(x.id),name:x.title,info:`${getProject(x.project).title} · ${getProject(x.project).phases[x.row]}`,daytaskId:x.id}));
 routines.filter(x=>routineVisible(x)).forEach(r=>t.push({id:`r:${todayKey}:${r.id}`,name:r.name,info:`↻ ${r.freq}`,routine:r.id}));return t;
}
function todayItemHTML(t){return `<div class="todayitem"><button class="tick ${isDone(t.id)?'done':''}" onclick="setDone('${t.id}',${!isDone(t.id)})" aria-label="${isDone(t.id)?'未完了に戻す':'完了にする'}">${isDone(t.id)?'✓':''}</button><button style="flex:1;text-align:left;background:none;border:0;color:inherit;padding:0" onclick="${t.daytaskId?`openDayTask('${t.daytaskId}')`:`openRoutine('${t.routine}')`}"><div class="tasktitle ${isDone(t.id)?'completed':''}">${esc(t.name)}</div><div class="meta">${esc(t.info)}　›</div></button></div>`}
function setDone(id,value){stored['d:'+id]=value;save();if(selected?.kind==='day')openDay(selected.key);else if(selected?.kind==='daytask')openDayTask(selected.id);else if(selected?.kind==='routine')openRoutine(selected.id);else if(selected?.kind==='bar')openBar(selected.index);else render()}
function openProject(id){stopFlow();closeDrawer();active=getProject(id);selectedDate=todayKey;render();requestAnimationFrame(()=>jumpToToday())}
function closeProject(){stopFlow();closeDrawer();active=null;render()}
function calendarDayHTML(key){const d=parseKey(key);const counts=dateTasks(active.id,key).length;return `<button type="button" class="week ${key===todayKey?'isToday':''} ${key===selectedDate?'isSelected':''}" title="${esc(formatDate(key))}の作業を見る" onclick="openDay('${key}')">${d.getMonth()+1}/${d.getDate()}<span>${['日','月','火','水','木','金','土'][d.getDay()]}</span>${counts?`<small class="count">${counts}</small>`:''}</button>`}
function renderTimeline(root){const p=active;const dayWidth=window.innerWidth<=390?68:74;const anchor=days.indexOf(todayKey);
 root.innerHTML=`<button class="back" onclick="closeProject()">← 全案件に戻る</button><div class="hero"><div class="eyebrow">PROJECT TIMELINE</div><h2>${esc(p.title)}</h2><div class="subline"><span>進行 ${p.progress}% · ${p.state}</span><span>次：${esc(p.next)}</span></div><div class="progress"><div class="fill" style="width:${p.progress}%;background:${p.color}"></div></div></div>
 <div class="sectionhead"><h2>動く進行表</h2><small>工程名は固定</small></div>
 <div class="controls"><button id="playBtn" class="primary" onclick="toggleFlow()">▶ ゆっくり流す</button><button onclick="stopFlow()">■ 停止</button><button onclick="jumpToToday()">◎ 今日へ</button><span class="speed">${speed}px/秒</span></div>
 <div class="timeline"><div class="timelinewrap"><div class="phasecol"><div class="corner">工程 ＼ 日付</div>${p.phases.map(n=>`<div class="phase">${esc(n)}</div>`).join('')}</div>
 <div class="timeviewport" id="timeviewport" aria-label="日付をタップできる横スクロール進行表"><div class="timeinner"><div class="dates">${days.map(calendarDayHTML).join('')}</div>
 ${p.phases.map((_,i)=>`<div class="lane">${p.bars.map((b,j)=>b.row===i?`<button class="bar ${isDone(`b:${p.id}:${j}`)?'done':''}" onclick="openBar(${j})" style="left:${b.start*7*dayWidth+8}px;width:${b.length*7*dayWidth-16}px;background:${p.color}">${esc(b.title)}　›</button>`:'').join('')}${dateTasksForRow(p.id,i).map(task=>{const dayIndex=days.indexOf(task.date);return dayIndex<0?'':`<button class="daymarker ${isDone(taskKey(task.id))?'isDone':''}" style="left:${dayIndex*dayWidth+dayWidth/2-8}px" onclick="openDay('${task.date}')" title="${esc(task.title)}">${isDone(taskKey(task.id))?'✓':'•'}</button>`}).join('')}<div class="dayline" style="left:${anchor*dayWidth}px"></div></div>`).join('')}
 </div></div></div></div><p class="timeline-foot"><strong>日付をタップすると、その日の作業が工程ごとに表示されます。</strong> 白い丸印は作業がある日です。日付は指でも横へスライドできます。</p><div class="sectionhead"><h2>次の確認</h2></div><div class="hint">${esc(p.next)}。工程バーをタップすると工程全体のメモを開けます。</div>`;
 const v=document.getElementById('timeviewport');v.addEventListener('pointerdown',stopFlow,{passive:true});v.addEventListener('wheel',stopFlow,{passive:true});
}
function dateTasksForRow(projectId,row){return allDayTasks().filter(t=>t.project===projectId&&t.row===row&&days.includes(t.date))}
function jumpToToday(){stopFlow();const v=document.getElementById('timeviewport');if(!v)return;const dayWidth=window.innerWidth<=390?68:74;const i=days.indexOf(todayKey);v.scrollLeft=Math.max(0,i*dayWidth-dayWidth)}
function toggleFlow(){if(animation){stopFlow();return}const v=document.getElementById('timeviewport');if(!v)return;if(v.scrollLeft>=v.scrollWidth-v.clientWidth-3)v.scrollLeft=0;const btn=document.getElementById('playBtn');if(btn)btn.textContent='⏸ 一時停止';lastTime=0;function step(ts){if(!lastTime)lastTime=ts;let dt=Math.min(40,ts-lastTime)/1000;lastTime=ts;v.scrollLeft+=speed*dt;if(v.scrollLeft>=v.scrollWidth-v.clientWidth-2){stopFlow();return;}animation=requestAnimationFrame(step)}animation=requestAnimationFrame(step)}
function stopFlow(){if(animation)cancelAnimationFrame(animation);animation=null;const b=document.getElementById('playBtn');if(b)b.textContent='▶ ゆっくり流す'}
function openDay(key){stopFlow();selected={kind:'day',key};selectedDate=key;
 const p=active;const tasks=dateTasks(p.id,key);document.querySelectorAll('.week').forEach(b=>{b.classList.toggle('isSelected',b.getAttribute('title')===formatDate(key)+'の作業を見る')});
 let s=`<div class="eyebrow">DAILY PROJECT TASKS</div><div class="dayheader"><h2>${esc(formatDate(key))}</h2><div class="smallnote">${esc(p.title)} · この日に行う作業</div></div>`;
 if(!tasks.length)s+='<div class="empty">この日に登録された作業はまだありません。</div>';
 let current=-1;for(const t of tasks){if(t.row!==current){current=t.row;s+=`<div class="dategroup"><span class="dot" style="background:${p.color}"></span>${esc(p.phases[current])}</div>`}
 s+=`<div class="daytask"><button class="tick ${isDone(taskKey(t.id))?'done':''}" aria-label="${isDone(taskKey(t.id))?'未完了に戻す':'完了にする'}" onclick="setDone('${taskKey(t.id)}',${!isDone(taskKey(t.id))})">${isDone(taskKey(t.id))?'✓':''}</button><button class="text" onclick="openDayTask('${t.id}')"><strong class="${isDone(taskKey(t.id))?'completed':''}">${esc(t.title)}</strong><small>${esc(t.detail||'タップして詳細を開く')}　›</small></button></div>`;
 }
 s+=`<div class="dayactions"><button class="action" onclick="openAddTask('${key}')">＋ この日に作業を追加</button></div><p class="smallnote">同じ工程でも、日付ごとに異なる作業を登録できます。</p>`;
 drawerShow(s);
}
function openDayTask(id){stopFlow();const t=byId(id);if(!t)return;const p=getProject(t.project);selected={kind:'daytask',id};const key=taskKey(id);const returnToDate=active?.id===t.project;
 const saved=stored['n:'+key];drawerShow(`<div class="eyebrow">TASK DETAIL / ${esc(p.title)}</div><h2 style="margin:14px 0 3px">${esc(t.title)}</h2><div class="todayDate">${esc(formatDate(t.date))} · ${esc(p.phases[t.row])}</div><p>${esc(t.detail||'作業の詳細を記録できます。')}</p><div class="field"><label for="task-note">確認・打ち合わせメモ</label><textarea id="task-note" placeholder="確認したこと、次にやることなど">${esc(saved||'')}</textarea></div><button class="action secondary" onclick="saveTaskNote('${id}')">メモを保存</button><button class="action" onclick="setDone('${key}',${!isDone(key)})">${isDone(key)?'未完了に戻す':'✓ この日の作業を完了'}</button><p><button class="back" onclick="${returnToDate?`openDay('${t.date}')`:`openProject('${p.id}');openDay('${t.date}')`}">← この日の作業一覧へ戻る</button></p>`)}
function saveTaskNote(id){stored['n:'+taskKey(id)]=document.getElementById('task-note').value;save();openDayTask(id)}
function openAddTask(key){selected={kind:'add',key};const p=active;
 drawerShow(`<div class="eyebrow">NEW DAILY TASK</div><h2 style="margin:12px 0">${esc(formatDate(key))}に追加</h2><div class="field"><label for="new-title">やること</label><input id="new-title" maxlength="110" placeholder="例：企画構成案を先方へ送る"></div><div class="field"><label for="new-phase">工程</label><select id="new-phase">${p.phases.map((phase,i)=>`<option value="${i}">${esc(phase)}</option>`).join('')}</select></div><div class="field"><label for="new-detail">内容・確認事項（任意）</label><textarea id="new-detail" placeholder="確認先、必要資料、注意点など"></textarea></div><div class="dayactions"><button class="action" onclick="addDayTask('${key}')">この日に登録</button><button class="action ghost" onclick="openDay('${key}')">キャンセル</button></div>`);
}
function addDayTask(key){const title=document.getElementById('new-title').value.trim();if(!title){alert('「やること」を入力してください');return;}const row=Number(document.getElementById('new-phase').value);const detail=document.getElementById('new-detail').value.trim();const id=`own-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;stored.customTasks.push({id,date:key,project:active.id,row,title,detail});save();const v=document.getElementById('timeviewport');const prevLeft=v?.scrollLeft;render();if(prevLeft!==undefined)document.getElementById('timeviewport').scrollLeft=prevLeft;openDay(key)}
function openBar(index){stopFlow();const p=active,b=p?.bars[index];if(!p||!b)return;selected={kind:'bar',index};const key=`b:${p.id}:${index}`;
 drawerShow(`<div class="eyebrow">${esc(p.title)} / ${esc(p.phases[b.row])}</div><h2 style="margin-top:12px">${esc(b.title)}</h2><p>${esc(b.detail)}</p><div class="field"><label for="bar-note">工程全体のメモ</label><textarea id="bar-note" placeholder="工程全体の確認事項など">${esc(stored['n:'+key]||'')}</textarea></div><button class="action secondary" onclick="saveBarNote('${key}')">メモを保存</button><button class="action" onclick="setDone('${key}',${!isDone(key)})">${isDone(key)?'未完了に戻す':'✓ 工程全体を完了'}</button><p class="smallnote">日ごとの作業は、タイムライン上の日付をタップして確認できます。</p>`)}
function saveBarNote(key){stored['n:'+key]=document.getElementById('bar-note').value;save();closeDrawer()}
function openRoutine(id){const r=routines.find(x=>x.id===id);if(!r)return;selected={kind:'routine',id};const key=`r:${todayKey}:${id}`;drawerShow(`<div class="eyebrow">RECURRING CHECK</div><h2 style="margin-top:12px">${esc(r.name)}</h2><p class="muted">↻ ${esc(r.freq)}</p><p>今日の分を確認したら完了にできます。次回の該当日は別のチェック欄になります。</p><button class="action" onclick="setDone('${key}',${!isDone(key)})">${isDone(key)?'未完了に戻す':'✓ 今日の分を完了にする'}</button>`)}
function drawerShow(content){document.getElementById('drawerContent').innerHTML=content;document.getElementById('shade').classList.add('show');document.getElementById('drawer').classList.add('show');document.getElementById('drawer').scrollTop=0}
function closeDrawer(){document.getElementById('shade').classList.remove('show');document.getElementById('drawer').classList.remove('show');selected=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
render();

</script></body></html>
