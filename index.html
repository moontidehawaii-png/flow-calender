const routineOn=(r,k)=>{const d=fromKey(k),w=d.getDay();return r.freq==='daily'||r.freq==='weekday'&&w>=1&&w<=5||r.freq==='mwf'&&[1,3,5].includes(w)||r.freq==='mon'&&w===1||r.freq==='tue'&&w===2||r.freq==='wed'&&w===3||r.freq==='thu'&&w===4||r.freq==='fri'&&w===5||r.freq==='sat'&&w===6||r.freq==='sun'&&w===0||r.freq==='monthly'&&d.getDate()===Number(r.day||1)};
const dayRoutines=k=>allRoutines().filter(r=>routineOn(r,k));
function eventsOn(k){const tasks=dateTasks(k).map(x=>({...x,type:'task',label:x.title,start:x.start||'',end:x.end||''}));const routines=dayRoutines(k).map(x=>({...x,type:'routine',label:x.title,start:x.at||'',end:x.end||'',date:k}));return tasks.concat(routines)}
const ordered=arr=>arr.slice().sort((a,b)=>((a.start||'zzzz').localeCompare(b.start||'zzzz'))||a.label.localeCompare(b.label));
const fixed=arr=>arr.filter(t=>t.start&&t.end).sort((a,b)=>minutes(a.start)-minutes(b.start));
function conflicts(k,start,end,ignore=null){if(!start||!end)return [];return fixed(eventsOn(k)).filter(x=>!(ignore&&x.type===ignore.type&&x.id===ignore.id)&&minutes(x.start)<minutes(end)&&minutes(start)<minutes(x.end));}
function freeWindows(k){const busy=fixed(eventsOn(k));let merged=[],s=9*60,e=18*60;for(const b of busy){const a=Math.max(s,minutes(b.start)),z=Math.min(e,minutes(b.end));if(a>=z)continue;if(merged.length&&a<=merged.at(-1)[1])merged.at(-1)[1]=Math.max(z,merged.at(-1)[1]);else merged.push([a,z])}const out=[];let cursor=s;for(const pair of merged){if(pair[0]-cursor>=30)out.push([cursor,pair[0]]);cursor=Math.max(cursor,pair[1])}if(e-cursor>=30)out.push([cursor,e]);return out;}
const hhmm=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function navbar(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+tab))}
function switchTab(t){stopFlow();closeSheet();active=null;tab=t;render()}
function render(){navbar();document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(today);const root=document.getElementById('main');if(active){renderProject(root);return}if(tab==='projects'){renderDashboard(root)}else if(tab==='today'){renderToday(root)}else{renderRoutines(root)}}
function renderDashboard(root){root.innerHTML=`<div class="section"><h2>プロジェクト一覧</h2><div class="seg"><button class="${view==='cards'?'current':''}" onclick="setView('cards')">カード</button><button class="${view==='flow'?'current':''}" onclick="setView('flow')">流れる一覧</button></div></div>${view==='cards'?projectCards():globalFlow()}<div class="section"><h2>今日の確認事項</h2><button class="btn flat" onclick="switchTab('today')">すべて見る →</button></div><div class="tiny">時間付きの予定は全案件で共通管理。時刻のない作業は「随時」と表示します。</div>${itemsHTML(eventsOn(todayKey).sort(sortEvents).slice(0,5),todayKey)}</div>`}
function sortEvents(a,b){return (a.start||'99:99').localeCompare(b.start||'99:99')}
function setView(v){stopFlow();view=v;render();if(v==='flow')requestAnimationFrame(jumpToday)}
function projectCards(){return projects.map(p=>`<button class="project" onclick="openProject('${p.id}')"><div class="projecttop"><span class="flex"><span class="dot" style="background:${p.color}"></span><strong>${esc(p.name)}</strong></span><span class="chev">›</span></div><div class="progress"><div style="background:${p.color};width:${p.progress}%"></div></div><div class="projectsub"><span>進行 ${p.progress}%</span><span>次：${esc(p.next)}</span></div></button>`).join('')+`<div class="ribbon"><button class="btn blue" onclick="setView('flow')">▤ 全案件を日付で流して見る</button><button class="btn" onclick="openDay('${todayKey}')">今日の空き時間</button></div>`}
function mondayOf(k){const d=fromKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)}
const days=Array.from({length:42},(_,i)=>shiftDay(mondayOf(todayKey),i));
function dayButton(k,scope=null){const count=dateTasks(k,scope).length;const d=fromKey(k);return `<button class="daybutton ${k===todayKey?'now':''}" onclick="openDay('${k}'${scope?`,'${scope}'`:''})" title="${esc(jpDate(k))} の予定を見る">${isoDate(k)}<small>${weekday[d.getDay()]}</small>${count?`<span class="count">${count}</span>`:''}</button>`}
function flowControls(){return `<div class="ribbon"><div class="btnrow"><button id="play" class="btn blue" onclick="toggleFlow()">▶ ゆっくり流す</button><button class="btn" onclick="stopFlow()">■ 停止</button><button class="btn" onclick="jumpToday()">◎ 今日へ</button></div><span class="miniStat">${scrollSpeed}px / 秒</span></div>`}
function globalFlow(){const todayIndex=days.indexOf(todayKey);return `<div class="intro">プロジェクト名は固定し、全案件の日付だけを横に流します。<strong>日付を押すと全案件の時間帯・空き時間</strong>を確認できます。</div>${flowControls()}<div class="flowview"><div class="fixedcol"><div class="fixedhead">案件 ＼ 日付</div>${projects.map(p=>`<button class="fixedrow go" onclick="openProject('${p.id}')"><span class="dot" style="background:${p.color};margin-right:5px"></span>${esc(p.name)} ›</button>`).join('')}</div><div class="scrollside" id="scrollside"><div class="flowinside"><div class="datehead">${days.map(k=>dayButton(k)).join('')}</div>${projects.map(p=>`<div class="lane">${days.map((k,i)=>{const scheduled=dateTasks(k,p.id),fixedTasks=scheduled.filter(t=>t.start&&t.end);return scheduled.length?`<button class="sumday" style="left:calc(${i}*var(--dayw) + 7px);border-color:${p.color}99" onclick="openDay('${k}','${p.id}')">${fixedTasks.length?esc(fixedTasks[0].start):scheduled.length+'件'}</button>`:''}).join('')}<span class="todayline" style="left:calc(${todayIndex}*var(--dayw))"></span></div>`).join('')}</div></div></div><p class="flowfoot">プロジェクト名をタップすると、その工程を開きます。日付をタップすると、案件を横断した当日の予定を表示します。</p>`}
function openProject(id){stopFlow();closeSheet();active=getP(id);render();requestAnimationFrame(jumpToday)}
function closeProject(){stopFlow();closeSheet();active=null;render()}
function renderProject(root){const p=active,todayIndex=days.indexOf(todayKey);root.innerHTML=`<button class="back" onclick="closeProject()">← 全案件へ戻る</button><div class="hero"><div class="eyebrow">PROJECT TIMELINE</div><h2>${esc(p.name)}</h2><div class="projectsub"><span>進行 ${p.progress}%</span><span>${esc(p.next)}</span></div><div class="progress"><div style="width:${p.progress}%;background:${p.color}"></div></div></div><div class="section"><h2>動く進行表</h2><small>工程名を固定</small></div>${flowControls()}<div class="flowview"><div class="fixedcol"><div class="fixedhead">工程 ＼ 日付</div>${p.phases.map(x=>`<div class="fixedrow">${esc(x)}</div>`).join('')}</div><div class="scrollside" id="scrollside"><div class="flowinside"><div class="datehead">${days.map(k=>dayButton(k,p.id)).join('')}</div>${p.phases.map((phase,row)=>`<div class="lane">${p.bars.map((bar,i)=>bar.row===row?`<button class="trackbar" style="left:calc(${bar.start*7}*var(--dayw) + 8px);width:calc(${bar.length*7}*var(--dayw) - 14px);background:${p.color}" onclick="openBar(${i})">${esc(bar.name)} ›</button>`:'').join('')}${allTasks().filter(t=>t.project===p.id&&t.row===row).map(t=>{const i=days.indexOf(t.date);return i<0?'':`<button class="mark ${done(taskKey(t.id))?'finished':''}" style="left:calc(${i}*var(--dayw) + var(--dayw)/2 - 9px)" onclick="openDay('${t.date}','${p.id}')" title="${esc(t.title)}">${done(taskKey(t.id))?'✓':'•'}</button>`}).join('')}<span class="todayline" style="left:calc(${todayIndex}*var(--dayw))"></span></div>`).join('')}</div></div></div><p class="flowfoot"><strong>日付 → 当日の作業とルーティン → 詳細</strong>の順に開きます。横スクロールでも移動できます。</p><div class="ribbon"><button class="btn blue" onclick="openDay('${todayKey}','${p.id}')">今日の作業と時間割を見る</button><button class="btn" onclick="openDay('${todayKey}')">全案件の予定を見る</button></div>`}
function scrollContainer(){return document.getElementById('scrollside')}
function jumpToday(){stopFlow();const s=scrollContainer();if(s){const i=days.indexOf(todayKey);const w=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dayw'));s.scrollLeft=Math.max(0,i*w-w)}}
function toggleFlow(){if(raf){stopFlow();return}const s=scrollContainer();if(!s)return;if(s.scrollLeft>=s.scrollWidth-s.clientWidth-3)s.scrollLeft=0;const b=document.getElementById('play');if(b)b.textContent='⏸ 一時停止';lastTick=0;const animate=(ts)=>{if(!lastTick)lastTick=ts;const dt=Math.min(45,ts-lastTick)/1000;lastTick=ts;s.scrollLeft+=dt*scrollSpeed;if(s.scrollLeft>=s.scrollWidth-s.clientWidth-2){stopFlow();return}raf=requestAnimationFrame(animate)};raf=requestAnimationFrame(animate)}
function stopFlow(){if(raf)cancelAnimationFrame(raf);raf=0;const b=document.getElementById('play');if(b)b.textContent='▶ ゆっくり流す'}
function taskEventMarkup(e,k){const id=e.type==='routine'?'r:'+k+':'+e.id:taskKey(e.id),isdone=done(id);return `<div class="dayentry"><button class="tick ${isdone?'done':''}" onclick="markDone('${id}',${!isdone})" aria-label="完了を切り替える">${isdone?'✓':''}</button><span class="timebadge ${!e.start?'flexible':''}">${e.start?esc(e.start):'随時'}${e.start&&e.end?`<small style="display:block">${esc(e.end)}まで</small>`:''}</span><button class="namebtn" onclick="${e.type==='routine'?`openRoutine('${e.id}','${k}')`:`openTask('${e.id}')`}"><strong class="${isdone?'doneText':''}">${esc(e.title||e.label)}</strong><small>${e.type==='routine'?'↻ ルーティン':esc(getP(e.project)?.name||'')}　›</small></button></div>`}
function itemsHTML(events,k){return events.length?events.map(e=>`<div class="todaycard"><span class="timebadge ${!e.start?'flexible':''}">${e.start?esc(e.start):'随時'}${e.end?`–${esc(e.end)}`:''}</span><button class="tick ${done(e.type==='routine'?'r:'+k+':'+e.id:taskKey(e.id))?'done':''}" onclick="markDone('${e.type==='routine'?'r:'+k+':'+e.id:taskKey(e.id)}',${!done(e.type==='routine'?'r:'+k+':'+e.id:taskKey(e.id))})">${done(e.type==='routine'?'r:'+k+':'+e.id:taskKey(e.id))?'✓':''}</button><button class="namebtn" onclick="${e.type==='routine'?`openRoutine('${e.id}','${k}')`:`openTask('${e.id}')`}"><strong>${esc(e.title||e.label)}</strong><small>${e.type==='routine'?'↻ ルーティン':esc(getP(e.project)?.name)} ›</small></button></div>`).join(''):'<div class="empty">登録された予定はありません。</div>'}
function renderToday(root){const items=ordered(eventsOn(todayKey));root.innerHTML=`<div class="section"><h2>今日やること</h2><span class="miniStat">${items.filter(x=>done(x.type==='routine'?'r:'+todayKey+':'+x.id:taskKey(x.id))).length}/${items.length} 完了</span></div><div class="intro">時間の決まった予定を先に表示します。空き時間は全案件共通で確認できます。</div><div class="ribbon"><button class="btn blue" onclick="openDay('${todayKey}')">◷ 今日の時間割を見る</button><button class="btn" onclick="openAdd('${todayKey}')">＋ 予定追加</button></div>${itemsHTML(items,todayKey)}`}
function frequencyLabel(r){return ({daily:'毎日',weekday:'平日（月〜金）',mwf:'月・水・金',mon:'毎週月曜',tue:'毎週火曜',wed:'毎週水曜',thu:'毎週木曜',fri:'毎週金曜',sat:'毎週土曜',sun:'毎週日曜',monthly:'毎月'+(r.day||1)+'日'})[r.freq]||r.freq}
function renderRoutines(root){root.innerHTML=`<div class="section"><h2>ルーティンと定型文</h2><button class="btn blue" onclick="openRoutineForm()">＋ ルーティン</button></div><div class="intro">ここで設定したルーティンは、該当する日の「DAILY PROJECT TASKS」にも自動表示されます。</div>${allRoutines().map(r=>`<div class="routinecard"><div><strong>${esc(r.title)}</strong><div class="sub">↻ ${esc(frequencyLabel(r))} · ${esc(timeLabel({start:r.at,end:r.end}))}</div></div><button class="btn" onclick="openRoutine('${r.id}','${todayKey}')">詳細 ›</button></div>`).join('')}<div class="section"><h2>入力用の定型文</h2><button class="btn" onclick="openTemplateForm()">＋ 定型文</button></div><div class="tiny">新しい予定を登録するときに、タイトルと詳細・時間を呼び出せます。</div>${stored.templates.map(t=>`<div class="routinecard"><div><strong>${esc(t.title)}</strong><div class="tiny">${esc(t.detail||'')} · ${esc(timeLabel(t))}</div></div><button class="btn" onclick="openTemplateForm('${t.id}')">編集 ›</button></div>`).join('')}`}
function showSheet(html,state){stopFlow();sheetState=state;document.getElementById('sheetContent').innerHTML=html;document.getElementById('shade').classList.add('on');document.getElementById('sheet').classList.add('on');document.getElementById('sheet').scrollTop=0;attachSwipe(state)}
function closeSheet(){document.getElementById('shade').classList.remove('on');document.getElementById('sheet').classList.remove('on');sheetState=null}
function attachSwipe(state){const sh=document.getElementById('sheet');sh.onpointerdown=null;sh.onpointerup=null;sh.onpointercancel=null;if(state?.kind!=='day')return;let x=0,y=0,isTracking=false;sh.onpointerdown=e=>{if(e.pointerType==='mouse')return;x=e.clientX;y=e.clientY;isTracking=true};sh.onpointercancel=()=>{isTracking=false};sh.onpointerup=e=>{if(!isTracking)return;isTracking=false;const dx=e.clientX-x,dy=e.clientY-y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)openDay(shiftDay(state.key,dx<0?1:-1),state.project)}}
function bandView(k){const busy=fixed(eventsOn(k));const min=8*60,max=20*60,total=max-min,scale=480/total;const clamped=busy.filter(e=>minutes(e.end)>min&&minutes(e.start)<max);let conflictsExist=false;for(let i=0;i<clamped.length;i++)for(let j=i+1;j<clamped.length;j++)if(minutes(clamped[i].start)<minutes(clamped[j].end)&&minutes(clamped[j].start)<minutes(clamped[i].end))conflictsExist=true;
const times=Array.from({length:13},(_,i)=>`<span style="top:${i*40}px">${String(i+8).padStart(2,'0')}:00</span>`).join('');
const bars=clamped.map(e=>{const top=(Math.max(min,minutes(e.start))-min)*scale;const high=Math.max(18,(Math.min(max,minutes(e.end))-Math.max(min,minutes(e.start)))*scale-1);const color=e.type==='routine'?'#34594b':getP(e.project)?.color||'#9accea';return `<button class="appointment ${e.type==='routine'?'routineEvent':''}" style="top:${top}px;height:${high}px;background:${color}" onclick="${e.type==='routine'?`openRoutine('${e.id}','${k}')`:`openTask('${e.id}')`}" title="${esc(e.title)}"><strong>${esc(e.start)}–${esc(e.end)} ${esc(e.title)}</strong>${high>34?`<small>${e.type==='routine'?'ルーティン':esc(getP(e.project)?.name)}</small>`:''}</button>`}).join('');
return `<div class="daybands"><div class="tiny">固定予定の時間帯（08:00〜20:00）<span class="clocknoted"> · 案件横断</span></div>${conflictsExist?'<div class="conflictFlag">⚠ 時間が重なっている予定があります</div>':''}<div class="timegrid"><div class="ticks">${times}</div><div class="timetrack">${bars}</div></div></div>`}
function openDay(k,project=null){const all=ordered(eventsOn(k)),visible=all.filter(e=>e.type==='routine'||!project||e.project===project),other=all.filter(e=>e.type==='task'&&project&&e.project!==project&&e.start);const timeFree=freeWindows(k);let html=`<div class="eyebrow">DAILY PROJECT TASKS</div><div class="sheettitle"><button onclick="openDay('${shiftDay(k,-1)}'${project?`,'${project}'`:''})" aria-label="前日">‹</button><h2>${esc(jpDate(k))}</h2><button onclick="openDay('${shiftDay(k,1)}'${project?`,'${project}'`:''})" aria-label="翌日">›</button></div><div class="sheethero"><strong>${project?esc(getP(project).name):'全プロジェクトの予定'}</strong><p>予定を選ぶと詳細が開きます。帯は他案件の予定も含む時間割です。</p></div>${bandView(k)}<div class="grouphead">◷ 空いている時間帯 <span class="tag">09:00〜18:00基準</span></div><div class="freechips">${timeFree.length?timeFree.slice(0,7).map(([a,b])=>`<button class="freechip" onclick="openAdd('${k}'${project?`,'${project}'`:',null'},'${hhmm(a)}','${hhmm(Math.min(a+60,b))}')">${hhmm(a)}–${hhmm(b)}</button>`).join(''):'<span class="tiny">30分以上の空きはありません</span>'}</div>`;
function group(title,arr){if(!arr.length)return '';return `<div class="grouphead">${title} <span class="tag">${arr.length}件</span></div>${ordered(arr).map(e=>taskEventMarkup(e,k)).join('')}`}
html+=group('● この日の作業',visible.filter(e=>e.type==='task'))+group('↻ この日のルーティン',visible.filter(e=>e.type==='routine'));
if(project&&other.length)html+=`<div class="outline">他案件の時間指定予定：${other.map(x=>esc(x.start)+' '+esc(x.title)).join(' / ')}</div><button class="btn flat" onclick="openDay('${k}')">全案件の予定を見る →</button>`;
if(!visible.length)html+='<div class="empty">この日に登録された作業はありません。</div>';
html+=`<div class="ribbon"><button class="btn action" onclick="openAdd('${k}'${project?`,'${project}'`:''})">＋ この日に予定を追加</button><button class="btn" onclick="openDay('${todayKey}'${project?`,'${project}'`:''})">今日に戻る</button></div><div class="swipehint">← 左右にスワイプすると前日・翌日に移動 →</div>`;
showSheet(html,{kind:'day',key:k,project})}
function markDone(id,value){stored['d:'+id]=value;save();const s=sheetState;if(s?.kind==='day')openDay(s.key,s.project);else if(s?.kind==='task')openTask(s.id);else if(s?.kind==='routine')openRoutine(s.id,s.key);else render()}
function openTask(id){const t=taskById(id);if(!t)return;const key=taskKey(id),p=getP(t.project);showSheet(`<div class="eyebrow">TASK DETAIL</div><h2 style="margin:10px 0">${esc(t.title)}</h2><div class="sheethero">${esc(jpDate(t.date))} · ${esc(p?.name)} / ${esc(p?.phases[t.row]||'作業')}<p>${esc(timeLabel(t))}</p></div><p class="detailnote">${esc(t.detail||'作業の内容・確認事項を記録してください。')}</p><div class="field"><label for="note">作業メモ</label><textarea id="note" placeholder="作業の進行、次の確認事項など">${esc(stored['n:'+key]||'')}</textarea></div><div class="btnrow"><button class="btn blue" onclick="saveTaskNote('${id}')">メモを保存</button><button class="btn" onclick="markDone('${key}',${!done(key)})">${done(key)?'未完了に戻す':'✓ 完了にする'}</button></div><div class="ribbon"><button class="btn flat" onclick="openDay('${t.date}','${t.project}')">← この日の一覧に戻る</button></div>`,{kind:'task',id})}
function saveTaskNote(id){stored['n:'+taskKey(id)]=document.getElementById('note').value;save();openTask(id)}
function openBar(i){if(!active)return;const p=active,b=p.bars[i];const k='b:'+p.id+':'+i;showSheet(`<div class="eyebrow">PROJECT PHASE</div><h2 style="margin:10px 0">${esc(b.name)}</h2><p class="detailnote">${esc(p.name)} · ${esc(b.detail)}</p><div class="field"><label for="barNote">工程のメモ</label><textarea id="barNote">${esc(stored['n:'+k]||'')}</textarea></div><button class="btn blue" onclick="stored['n:'+${JSON.stringify(k)}]=document.getElementById('barNote').value;save();closeSheet()">保存</button><p class="detailnote">その日の内容は進行表の日付から確認できます。</p>`,{kind:'bar'})}
function updatePhaseOptions(){const id=document.getElementById('fproject')?.value;const sel=document.getElementById('fphase');if(!sel)return;sel.innerHTML=(getP(id)?.phases||[]).map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('')}
function applyTemplate(){const t=stored.templates.find(x=>x.id===document.getElementById('ftemplate').value);if(!t)return;document.getElementById('ftitle').value=t.title;document.getElementById('fdetail').value=t.detail||'';document.getElementById('fstart').value=t.start||'';document.getElementById('fend').value=t.end||'';updateTimeConflicts()}
function openAdd(k,project=null,start='',end=''){const selectedP=project||projects[0].id;showSheet(`<div class="eyebrow">NEW SCHEDULE</div><h2 style="margin:10px 0">予定・作業を登録</h2><div class="field"><label for="ftemplate">定型文から入力（任意）</label><select id="ftemplate" onchange="applyTemplate()"><option value="">定型文を選ぶ</option>${stored.templates.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></div><div class="field"><label for="ftitle">やること・予定名</label><input id="ftitle" maxlength="120" placeholder="例：カタログ構成の打ち合わせ"></div><div class="field"><label for="fdate">日付</label><input type="date" id="fdate" value="${k}" onchange="updateTimeConflicts()"></div><div class="field"><label for="fproject">プロジェクト</label><select id="fproject" onchange="updatePhaseOptions()">${projects.map(p=>`<option value="${p.id}" ${p.id===selectedP?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label for="fphase">工程</label><select id="fphase"></select></div><div class="formgrid"><div class="field"><label for="fstart">開始時刻（任意）</label><input id="fstart" type="time" value="${start}" onchange="updateTimeConflicts()"></div><div class="field"><label for="fend">終了時刻（任意）</label><input id="fend" type="time" value="${end}" onchange="updateTimeConflicts()"></div></div><div id="conflictBox"></div><div class="field"><label for="fdetail">作業内容・確認事項</label><textarea id="fdetail" placeholder="確認すること、会議の目的、持ち物など"></textarea></div><label class="checkLabel"><input type="checkbox" id="saveTemplate"> この内容を定型文として保存する</label><div class="btnrow"><button class="btn action" onclick="addTask()">予定を登録</button><button class="btn" onclick="openDay('${k}'${project?`,'${project}'`:''})">戻る</button></div>`,{kind:'add',key:k,project});updatePhaseOptions();updateTimeConflicts()}
function updateTimeConflicts(){const date=document.getElementById('fdate')?.value,start=document.getElementById('fstart')?.value,end=document.getElementById('fend')?.value,box=document.getElementById('conflictBox');if(!box)return;if(!date||!start&&!end){box.innerHTML='<div class="tiny">時間を指定しない作業は「随時」として登録され、他の予定を塞ぎません。</div>';return}if(!start||!end){box.innerHTML='<div class="warn">開始・終了は両方入力してください。</div>';return}if(minutes(end)<=minutes(start)){box.innerHTML='<div class="warn">終了時刻は開始時刻より後にしてください。</div>';return}const hits=conflicts(date,start,end);box.innerHTML=hits.length?`<div class="warn">⚠ ${hits.length}件の予定と重なります：${hits.map(x=>esc(x.start)+' '+esc(x.label)).join('、')}<br>別の時刻を選んでください。</div>`:'<div class="success">✓ 他のプロジェクトやルーティンと重なっていません。</div>'}
function addTask(){const title=document.getElementById('ftitle').value.trim(),date=document.getElementById('fdate').value,project=document.getElementById('fproject').value,row=Number(document.getElementById('fphase').value),start=document.getElementById('fstart').value,end=document.getElementById('fend').value,detail=document.getElementById('fdetail').value.trim();if(!title){alert('予定名を入力してください');return}if(!date){alert('日付を選んでください');return}if(Boolean(start)!==Boolean(end)){alert('開始と終了を両方入力するか、両方空欄にしてください');return}if(start&&(minutes(end)<=minutes(start))){alert('終了時刻は開始時刻より後にしてください');return}const hits=start?conflicts(date,start,end):[];if(hits.length){updateTimeConflicts();alert('他の予定と重なっているため、登録できません。空いている時間に変更してください。');return}stored.customTasks.push({id:'own-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),title,date,project,row,start,end,detail});if(document.getElementById('saveTemplate').checked)stored.templates.push({id:'template-'+Date.now(),title,detail,start,end});save();render();openDay(date,active?.id===project?project:null)}
function openRoutine(id,k=todayKey){const r=routineById(id);if(!r)return;const isOwn=stored.extraRoutines.some(x=>x.id===id),key='r:'+k+':'+id;showSheet(`<div class="eyebrow">RECURRING TASK</div><h2 style="margin:11px 0">${esc(r.title)}</h2><div class="sheethero">↻ ${esc(frequencyLabel(r))}<p>${esc(timeLabel({start:r.at,end:r.end}))} · ${esc(jpDate(k))}</p></div><p class="detailnote">${esc(r.detail||'繰り返しの確認事項')}</p><div class="btnrow"><button class="btn blue" onclick="markDone('${key}',${!done(key)})">${done(key)?'未完了に戻す':'✓ この日を完了'}</button>${isOwn?`<button class="btn" onclick="openRoutineForm('${id}')">編集する</button>`:''}</div><div class="ribbon"><button class="btn flat" onclick="openDay('${k}')">← この日の一覧へ</button></div>`,{kind:'routine',id,key:k})}
function openRoutineForm(id=null){const r=id?routineById(id):null;showSheet(`<div class="eyebrow">ROUTINE RULE</div><h2 style="margin:10px 0">${r?'ルーティンを編集':'新しいルーティンを登録'}</h2><div class="field"><label for="rtitle">確認事項</label><input id="rtitle" value="${esc(r?.title||'')}" placeholder="例：月曜に売上速報を確認"></div><div class="field"><label for="rfreq">繰り返し</label><select id="rfreq" onchange="document.getElementById('rmonth').style.display=this.value==='monthly'?'block':'none'">${[['daily','毎日'],['weekday','平日'],['mwf','月・水・金'],['mon','毎週月曜'],['tue','毎週火曜'],['wed','毎週水曜'],['thu','毎週木曜'],['fri','毎週金曜'],['sat','毎週土曜'],['sun','毎週日曜'],['monthly','毎月指定日']].map(([v,l])=>`<option value="${v}" ${r?.freq===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field" id="rmonth" style="display:${r?.freq==='monthly'?'block':'none'}"><label for="rday">毎月の日付（1〜28）</label><input id="rday" type="number" min="1" max="28" value="${Number(r?.day||1)}"></div><div class="formgrid"><div class="field"><label for="rat">開始（任意）</label><input type="time" id="rat" value="${r?.at||''}"></div><div class="field"><label for="rend">終了（任意）</label><input type="time" id="rend" value="${r?.end||''}"></div></div><div class="field"><label for="rdetail">内容・確認事項</label><textarea id="rdetail">${esc(r?.detail||'')}</textarea></div><div class="btnrow"><button class="btn action" onclick="saveRoutine('${id||''}')">${r?'変更を保存':'登録する'}</button>${r&&stored.extraRoutines.some(x=>x.id===id)?`<button class="btn" onclick="deleteRoutine('${id}')">削除</button>`:''}</div>`,{kind:'routine-form',id})}
function saveRoutine(id){const title=document.getElementById('rtitle').value.trim(),freq=document.getElementById('rfreq').value,at=document.getElementById('rat').value,end=document.getElementById('rend').value,detail=document.getElementById('rdetail').value.trim(),day=Number(document.getElementById('rday').value);if(!title){alert('確認事項を入力してください');return}if(Boolean(at)!==Boolean(end)||at&&minutes(end)<=minutes(at)){alert('開始・終了時刻を正しく設定してください');return}if(freq==='monthly'&&(!Number.isInteger(day)||day<1||day>28)){alert('毎月の日付は1〜28を指定してください');return}const val={id:id||'routine-'+Date.now(),title,freq,at,end,detail,day};if(id){const i=stored.extraRoutines.findIndex(r=>r.id===id);if(i<0){alert('サンプルのルーティンは編集できません。新しいものを作成してください。');return}stored.extraRoutines[i]=val}else stored.extraRoutines.push(val);save();closeSheet();render()}
function deleteRoutine(id){if(!confirm('このルーティンを削除しますか？'))return;stored.extraRoutines=stored.extraRoutines.filter(r=>r.id!==id);save();closeSheet();render()}
function openTemplateForm(id=null){const t=stored.templates.find(x=>x.id===id);showSheet(`<div class="eyebrow">TEXT TEMPLATE</div><h2 style="margin:10px 0">定型文${t?'を編集':'を登録'}</h2><div class="field"><label for="ttitle">タイトル</label><input id="ttitle" value="${esc(t?.title||'')}"></div><div class="field"><label for="tdetail">内容</label><textarea id="tdetail">${esc(t?.detail||'')}</textarea></div><div class="formgrid"><div class="field"><label for="tstart">開始（任意）</label><input id="tstart" type="time" value="${t?.start||''}"></div><div class="field"><label for="tend">終了（任意）</label><input id="tend" type="time" value="${t?.end||''}"></div></div><div class="btnrow"><button class="btn action" onclick="saveTemplate('${id||''}')">保存</button>${id?`<button class="btn" onclick="deleteTemplate('${id}')">削除</button>`:''}</div>`,{kind:'template'})}
function saveTemplate(id){const title=document.getElementById('ttitle').value.trim(),detail=document.getElementById('tdetail').value.trim(),start=document.getElementById('tstart').value,end=document.getElementById('tend').value;if(!title){alert('タイトルを入力してください');return}if(Boolean(start)!==Boolean(end)||start&&minutes(end)<=minutes(start)){alert('時刻の指定を確認してください');return}const item={id:id||'template-'+Date.now(),title,detail,start,end};if(id){stored.templates=stored.templates.map(t=>t.id===id?item:t)}else stored.templates.push(item);save();closeSheet();render()}
function deleteTemplate(id){if(!confirm('この定型文を削除しますか？'))return;stored.templates=stored.templates.filter(t=>t.id!==id);save();closeSheet();render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
// 指でタイムラインを操作した場合は自動スクロールを停止する
let mouseDown=false;document.addEventListener('pointerdown',e=>{if(e.target.closest('#scrollside')){stopFlow();mouseDown=true}});document.addEventListener('pointerup',()=>{mouseDown=false});
render();
</script></body></html>
