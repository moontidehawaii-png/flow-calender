<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FLOW / 動くカレンダー — prototype v0.2</title><style>
:root{--bg:#0d121c;--panel:#161d29;--panel2:#1d2635;--line:#2e394c;--ink:#eef2f7;--muted:#94a3b8;--accent:#8cc9ff;--mint:#8de3c1;--amber:#ffd38c;--red:#fa9c9c}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.app{max-width:820px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{padding:25px 20px 12px;display:flex;justify-content:space-between;align-items:center}.eyebrow{color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.18em}h1{margin:5px 0;font-size:27px;letter-spacing:-.04em}h2{font-size:18px;margin:0}p{line-height:1.65}.muted{color:var(--muted)}.date{font-size:12px;color:var(--muted);margin-top:5px}.pill{padding:6px 10px;border:1px solid var(--line);border-radius:30px;color:var(--muted);font-size:11px;white-space:nowrap}.nav{display:flex;gap:5px;padding:5px;margin:6px 18px 16px;border-radius:15px;background:var(--panel)}.nav button{flex:1;background:transparent;color:var(--muted);border:0;border-radius:11px;padding:12px 5px;font-size:12px}.nav button.on{background:#34435a;color:white;font-weight:700}main{padding:0 18px 38px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:23px 2px 11px}.sectionhead small{color:var(--muted)}.project{width:100%;display:block;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:17px;color:var(--ink);padding:16px;margin:9px 0}.project:hover{border-color:#7a90ac}.projecttop{display:flex;justify-content:space-between;align-items:center}.titleline{display:flex;align-items:center;gap:10px}.dot{width:9px;height:9px;border-radius:50%;flex:none}.chev{color:#8b9bb0;font-size:20px}.progress{height:5px;background:#2b3949;border-radius:10px;overflow:hidden;margin-top:14px}.fill{height:100%;border-radius:10px}.subline{display:flex;justify-content:space-between;margin-top:11px;color:var(--muted);font-size:11px;gap:10px}.todayitem{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;margin:8px 0}.tick{width:23px;height:23px;border:1px solid #718398;background:transparent;border-radius:8px;flex:none;color:var(--mint)}.tick.done{background:#214539;border-color:#37745d}.tasktitle{font-size:13px;font-weight:600;line-height:1.5}.completed{text-decoration:line-through;color:var(--muted)}.meta{color:var(--muted);font-size:11px;margin-top:5px}.empty{padding:35px 12px;color:var(--muted);text-align:center}.hint{padding:14px;border-radius:12px;background:#1c2a3b;color:#bad3ec;font-size:12px;line-height:1.7}.back{background:transparent;border:0;color:var(--accent);padding:0;font-size:13px}.hero{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:17px;margin:14px 0}.hero h2{margin:4px 0 10px}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:11px}.controls button{background:#243348;color:#eaf2fc;border:1px solid #40526c;border-radius:11px;padding:9px 13px;font-size:12px}.controls button.primary{background:#315a7d;border-color:#5582a4}.controls .speed{color:var(--muted);font-size:11px;margin-left:auto}.timeline{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#121a26}.timelinewrap{display:flex}.phasecol{width:100px;flex:none;z-index:3;box-shadow:5px 0 12px #0c121cb0;background:#202b3b}.corner,.dates{height:42px;border-bottom:1px solid var(--line);display:flex;align-items:center}.corner{padding:0 12px;color:var(--muted);font-size:11px}.phase{height:64px;padding:10px 9px;border-bottom:1px solid var(--line);display:flex;align-items:center;font-size:12px;font-weight:600}.timeviewport{overflow-x:auto;flex:1;scrollbar-width:thin;scrollbar-color:#44566d transparent;overscroll-behavior-x:contain}.timeinner{width:2352px}.dates{position:sticky;top:0;background:#243246;z-index:2}.week{width:56px;flex:none;text-align:center;color:#bdd0e6;font-size:11px;border-right:1px solid #3a4860}.week.isToday{background:#385873;color:white;font-weight:700}.week span{font-size:10px;color:#8fa5bd}.week.isToday span{color:white}.lane{height:64px;position:relative;border-bottom:1px solid var(--line);background-image:linear-gradient(to right,#253247 1px,transparent 1px);background-size:56px 100%}.bar{position:absolute;top:15px;height:33px;border:0;border-radius:8px;color:#101b29;font-weight:700;padding:0 10px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;text-align:left;font-size:11px}.bar.done{opacity:.5}.timeline-foot{font-size:11px;color:var(--muted);margin-top:9px}.drawerShade{position:fixed;inset:0;background:#030711b9;z-index:20;display:none}.drawerShade.show{display:block}.drawer{position:fixed;bottom:0;left:0;right:0;max-width:820px;margin:auto;z-index:21;background:#202a3a;border:1px solid #455670;border-radius:23px 23px 0 0;transform:translateY(110%);transition:transform .26s ease;padding:21px 20px max(26px,env(safe-area-inset-bottom));max-height:82vh;overflow:auto}.drawer.show{transform:translateY(0)}.drawerhandle{height:4px;width:42px;background:#8192a7;border-radius:8px;margin:-8px auto 20px}.drawerclose{float:right;background:transparent;color:white;border:0;font-size:22px}.drow{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:16px 0}.status{font-size:11px;color:var(--mint)}.action{background:#9dd7ff;color:#102335;border:0;padding:13px 16px;border-radius:12px;font-weight:750}.action.secondary{background:#34445b;color:#e7eff8}.formline{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}textarea{width:100%;min-height:75px;background:#111c29;color:white;border:1px solid #46566d;border-radius:10px;padding:11px;resize:vertical}.smallnote{font-size:11px;color:var(--muted);line-height:1.6}.routine{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:9px 0}.freq{font-size:11px;color:var(--mint)}.footer{color:#64748b;text-align:center;font-size:10px;padding:15px}.counter{font-size:12px;color:var(--mint);font-weight:700}@media(prefers-reduced-motion:reduce){.drawer{transition:none}}@media(max-width:390px){.phasecol{width:87px}.week{width:152px}h1{font-size:24px}}
</style></head><body><div class="app"><header><div><div class="eyebrow">FLOW · PERSONAL PROJECT CALENDAR</div><h1>動くカレンダー</h1><div id="date" class="date"></div></div><span class="pill">PROTOTYPE 0.2</span></header><nav class="nav" aria-label="画面切り替え"><button id="tab-projects" class="on" onclick="switchTab('projects')">全案件</button><button id="tab-today" onclick="switchTab('today')">今日やること</button><button id="tab-routines" onclick="switchTab('routines')">ルーティン</button></nav><main id="main"></main><div class="footer">FLOW 0.2 · 仮の案件データです · 入力と完了はこのブラウザ内に保存</div></div><div class="drawerShade" id="shade" onclick="closeDrawer()"></div><div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="作業詳細"><div class="drawerhandle"></div><button class="drawerclose" onclick="closeDrawer()" aria-label="閉じる">×</button><div id="drawerContent"></div></div><script>
const projects=[{id:'catalog',title:'製品カタログ制作',color:'#83c6ff',progress:75,next:'校正内容の最終確認',state:'進行中',phases:['企画','制作','校正','納品'],bars:[{row:0,start:0,length:2,title:'構成・方向性',detail:'ターゲットと商品構成の確認',due:'第2週'},{row:1,start:2,length:2,title:'デザイン・画像',detail:'素材の手配と紙面の制作',due:'第4週'},{row:2,start:4,length:1,title:'最終校正',detail:'修正指示をまとめ、最終版を確認する',due:'第5週'},{row:3,start:5,length:1,title:'入稿・印刷',detail:'印刷仕様・部数・納品場所を確認する',due:'第6週'}]},{id:'event',title:'ライダー向けイベント企画',color:'#ffcf87',progress:48,next:'運営と告知の確認',state:'確認待ち',phases:['企画','会場・協力','集客','本番'],bars:[{row:0,start:0,length:2,title:'企画構成',detail:'コンセプトと実施内容の決定',due:'第2週'},{row:1,start:2,length:2,title:'運営調整',detail:'協力先、会場、スタッフの役割を確認',due:'第4週'},{row:2,start:3,length:2,title:'SNS・告知',detail:'告知素材、配信日、申込み状況を確認',due:'第5週'},{row:3,start:5,length:1,title:'実施・記録',detail:'当日の進行と写真・動画記録',due:'第6週'}]},{id:'ec',title:'ECサイト販促改善',color:'#95e5c8',progress:86,next:'広告設定・成果の確認',state:'進行中',phases:['調査','商品情報','集客施策','効果検証'],bars:[{row:0,start:0,length:1,title:'課題整理',detail:'サイト流入と商品導線を調べる',due:'第1週'},{row:1,start:1,length:2,title:'説明・SEO改善',detail:'商品ページと検索表示情報の修正',due:'第3週'},{row:2,start:3,length:2,title:'広告と連携',detail:'媒体設定と商品連携を確認',due:'第5週'},{row:3,start:5,length:1,title:'結果確認',detail:'クリック・流入・注文の状況を確認',due:'第6週'}]}];
const routines=[{id:'morning',name:'今日の優先順位と予定を確認',freq:'毎日',when:'daily'},{id:'reply',name:'連絡待ち・確認待ちを見直す',freq:'月・水・金',when:'mwf'},{id:'weekly',name:'進行中の案件を棚卸し',freq:'毎週月曜日',when:'monday'},{id:'evening',name:'未完了項目を振り返る',freq:'毎日',when:'daily'}];
let stored={};try{stored=JSON.parse(localStorage.getItem('flow-demo-v01')||'{}')}catch(e){}let tab='projects',active=null,selected=null,animation=null,lastTime=0,speed=85;const today=new Date(),datekey=`${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;const weekday=today.getDay();document.getElementById('date').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(today);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('flow-demo-v01',JSON.stringify(stored))}function done(id){return !!stored['d:'+id]}function setDone(id,value){stored['d:'+id]=value;save();render();if(selected)openDrawer(selected)}function routineVisible(r){return r.when==='daily'||r.when==='mwf'&&[1,3,5].includes(weekday)||r.when==='monday'&&weekday===1}function switchTab(t){stopFlow();active=null;tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.id==='tab-'+t));render()}function render(){const root=document.getElementById('main');if(active){renderTimeline(root);return}if(tab==='projects'){root.innerHTML='<div class="sectionhead"><h2>プロジェクト一覧</h2><small>タップして流れを見る</small></div><div class="hint">予定の一覧ではなく、案件の「進み具合」を入口にする設計。各カードをタップすると、工程がゆっくり流れるタイムラインを開きます。</div>'+projects.map(p=>`<button class="project" onclick="openProject('${p.id}')"><div class="projecttop"><div class="titleline"><span class="dot" style="background:${p.color}"></span><strong>${esc(p.title)}</strong></div><span class="chev">›</span></div><div class="progress"><div class="fill" style="width:${p.progress}%;background:${p.color}"></div></div><div class="subline"><span>進行 ${p.progress}% · ${p.state}</span><span>次：${esc(p.next)}</span></div></button>`).join('')+'<div class="sectionhead"><h2>今日の確認事項</h2><button class="back" onclick="switchTab(\'today\')">すべて見る →</button></div>'+todayItems().slice(0,2).map(taskHTML).join('')}
else if(tab==='today'){let items=todayItems();root.innerHTML=`<div class="sectionhead"><h2>今日やること</h2><span class="counter">${items.filter(x=>done(x.id)).length} / ${items.length} 完了</span></div><div class="hint">ルーティンは該当曜日に自動登場します。チェックすると完了が保存され、翌日の定期タスクは新しいチェック欄になります。</div>`+(items.map(taskHTML).join('')||'<div class="empty">今日の定型タスクはありません</div>')}
else{root.innerHTML='<div class="sectionhead"><h2>繰り返す確認</h2><small>ルールの見本</small></div><div class="hint">ルーティンは予定表に毎回書き込みません。登録ルールに基づき、該当日の「今日やること」に自動表示します。</div>'+routines.map(r=>`<div class="routine"><div><strong>${esc(r.name)}</strong><div class="freq">↻ ${esc(r.freq)}</div></div><span class="pill">有効</span></div>`).join('')+'<p class="smallnote">※ v0.1ではルーティンの追加・編集はまだできません。次の試作で設計します。</p>'}}
function todayItems(){const t=[{id:'p:catalog:2',name:'カタログの最終校正内容を確認',info:'製品カタログ制作 · 今日の確認',project:'catalog',bar:2},{id:'p:event:1',name:'イベント運営に確認事項を連絡',info:'ライダー向けイベント企画 · フォロー',project:'event',bar:1},{id:'p:ec:3',name:'EC広告設定をチェック',info:'ECサイト販促改善 · 次のアクション',project:'ec',bar:3}];routines.filter(routineVisible).forEach(r=>t.push({id:`r:${datekey}:${r.id}`,name:r.name,info:`↻ ${r.freq}`,routine:r.id}));return t}function taskHTML(t){return `<div class="todayitem"><button class="tick ${done(t.id)?'done':''}" aria-label="${done(t.id)?'未完了に戻す':'完了にする'}" onclick="setDone('${t.id}',${!done(t.id)})">${done(t.id)?'✓':''}</button><div style="flex:1" onclick="${t.project?`openProject('${t.project}');openBar(${t.bar})`:`openRoutine('${t.routine}')`}" role="button" tabindex="0"><div class="tasktitle ${done(t.id)?'completed':''}">${esc(t.name)}</div><div class="meta">${esc(t.info)}　›</div></div></div>`}function openProject(id){active=projects.find(p=>p.id===id);render()}function calendarDays(){const base=new Date(today.getFullYear(),today.getMonth(),today.getDate());base.setDate(base.getDate()-((base.getDay()+6)%7));return Array.from({length:42},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);const isToday=d.toDateString()===today.toDateString();const day=['日','月','火','水','木','金','土'][d.getDay()];return `<div class="week${isToday?' isToday':''}" title="${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日">${d.getMonth()+1}/${d.getDate()}<br><span>${day}</span></div>`}).join('')}
function renderTimeline(root){const p=active;root.innerHTML=`<button class="back" onclick="closeProject()">← 全案件に戻る</button><div class="hero"><div class="eyebrow">PROJECT TIMELINE</div><h2>${esc(p.title)}</h2><div class="subline"><span>進行 ${p.progress}% · ${p.state}</span><span>次：${esc(p.next)}</span></div><div class="progress"><div class="fill" style="width:${p.progress}%;background:${p.color}"></div></div></div><div class="sectionhead"><h2>動く進行表</h2><small>左列は固定</small></div><div class="controls"><button id="playBtn" class="primary" onclick="toggleFlow()">▶ ゆっくり流す</button><button onclick="stopFlow()">■ 停止</button><button onclick="resetFlow()">↶ 先頭へ</button><span class="speed">日付が横に流れます · ${speed}px/秒</span></div><div class="timeline"><div class="timelinewrap"><div class="phasecol"><div class="corner">工程 ＼ 日付</div>${p.phases.map(n=>`<div class="phase">${esc(n)}</div>`).join('')}</div><div class="timeviewport" id="timeviewport" aria-label="横スクロール式タイムライン"><div class="timeinner"><div class="dates">${calendarDays()}</div>${p.phases.map((_,i)=>`<div class="lane">${p.bars.map((b,j)=>b.row===i?`<button class="bar ${done(`b:${p.id}:${j}`)?'done':''}" onclick="openBar(${j})" style="left:${b.start*392+8}px;width:${b.length*392-16}px;background:${p.color}">${esc(b.title)}　›</button>`:'').join('')}</div>`).join('')}</div></div></div></div><p class="timeline-foot">▶ で本文だけが横へ流れます。マウスや指で操作すると一時停止。工程名は固定したまま、作業をタップして詳細を開けます。</p><div class="sectionhead"><h2>次の確認</h2></div><div class="hint">${esc(p.next)} — 詳細を開くと作業メモと完了状態を記録できます。</div>`;document.getElementById('timeviewport').addEventListener('pointerdown',stopFlow,{passive:true});document.getElementById('timeviewport').addEventListener('wheel',stopFlow,{passive:true})}function closeProject(){stopFlow();active=null;render()}function toggleFlow(){if(animation){stopFlow();return}const el=document.getElementById('timeviewport');if(!el)return;if(el.scrollLeft>=el.scrollWidth-el.clientWidth-3)el.scrollLeft=0;const btn=document.getElementById('playBtn');if(btn)btn.textContent='⏸ 一時停止';lastTime=0;function step(ts){if(!lastTime)lastTime=ts;const dt=Math.min(40,ts-lastTime)/1000;lastTime=ts;el.scrollLeft+=speed*dt;if(el.scrollLeft>=el.scrollWidth-el.clientWidth-2){stopFlow();return}animation=requestAnimationFrame(step)}animation=requestAnimationFrame(step)}function stopFlow(){if(animation)cancelAnimationFrame(animation);animation=null;const btn=document.getElementById('playBtn');if(btn)btn.textContent='▶ ゆっくり流す'}function resetFlow(){stopFlow();const el=document.getElementById('timeviewport');if(el)el.scrollTo({left:0,behavior:'smooth'})}function openBar(index){stopFlow();const p=active,b=p.bars[index];selected={kind:'bar',p,index};const id=`b:${p.id}:${index}`;drawerShow(`<div class="eyebrow">${esc(p.title)} / ${esc(p.phases[b.row])}</div><h2 style="margin-top:12px">${esc(b.title)}</h2><div class="drow"><span class="pill">${esc(b.due)}</span><span class="status">${done(id)?'✓ 完了':'● 進行・確認事項'}</span></div><p>${esc(b.detail)}</p><div class="formline"><label class="muted" for="note">メモ・確認したこと</label><textarea id="note" placeholder="打ち合わせ内容、未解決事項、次のアクションなど">${esc(stored['n:'+id]||'')}</textarea><button class="action secondary" onclick="saveNote('${id}')">メモを保存</button><button class="action" onclick="setDone('${id}',${!done(id)})">${done(id)?'未完了に戻す':'✓ この工程を完了にする'}</button></div><p class="smallnote">この版は単独端末での保存です。予定や進捗の自動更新・同期機能はまだありません。</p>`)}function saveNote(id){stored['n:'+id]=document.getElementById('note').value;save();closeDrawer()}function openRoutine(id){selected={kind:'routine',id};const r=routines.find(x=>x.id===id),key=`r:${datekey}:${id}`;drawerShow(`<div class="eyebrow">RECURRING CHECK</div><h2 style="margin-top:12px">${esc(r.name)}</h2><p class="muted">↻ ${esc(r.freq)}</p><p>今日の分を確認したら完了にできます。翌日の定型タスクは別のチェックとして自動生成されます。</p><button class="action" onclick="setDone('${key}',${!done(key)})">${done(key)?'未完了に戻す':'✓ 今日の分を完了にする'}</button>`)}function drawerShow(html){document.getElementById('drawerContent').innerHTML=html;document.getElementById('shade').classList.add('show');document.getElementById('drawer').classList.add('show')}function closeDrawer(){document.getElementById('shade').classList.remove('show');document.getElementById('drawer').classList.remove('show');selected=null}function openDrawer(s){if(s.kind==='bar')openBar(s.index);else openRoutine(s.id)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});render();
</script></body></html>
